# Manual deploy to Cloudflare (never on push: a deploy ends live interviews). Runs the same deploy.sh as locally,
# which rebuilds, tests and only then publishes. Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy
# Hardening (B1): every action is pinned to a commit SHA (the tag is in the trailing comment; Dependabot proposes updates), the token is read-only
# (contents: read, no write scopes anywhere), checkout keeps no credentials, wrangler is pinned to an exact version in deploy.sh, and the only
# trigger is a manual dispatch on main behind the `production` environment. No privileged pull-request trigger anywhere.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish (make sure nobody is in an interview)'
        required: true
concurrency: { group: deploy, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy/cloudflare-edge/deploy.sh
