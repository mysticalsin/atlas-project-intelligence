# Manual deploy to Cloudflare (never on push: a deploy ends live interviews). Runs the same deploy.sh as locally,
# which rebuilds, tests and only then publishes. Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish (make sure nobody is in an interview)'
        required: true
concurrency: { group: deploy, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      # Same verified tag SHAs as ci.yml (actions/checkout v4, actions/setup-node v4, actions/setup-python v5).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13' }
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy/cloudflare-edge/deploy.sh
