# Manual deploy to Cloudflare (never on push: a deploy ends live interviews). Runs the same deploy.sh as locally,
# which rebuilds, tests and only then publishes. Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish (make sure nobody is in an interview)'
        required: true
concurrency: { group: deploy, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy/cloudflare-edge/deploy.sh
