# Every push and pull request: the full ATLAS test suite (no provider keys, no network calls to paid services).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Tag SHAs resolved from GitHub on 2026-11-08: actions/checkout v4, actions/setup-node v4, actions/setup-python v5.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13' }
      - name: Python dependencies
        run: pip install -r requirements.txt -r requirements-test.txt msgpack pyjwt cryptography playwright python-docx
      - name: Build the page twice and check the canonical hash
        run: bash scripts/verify_page_build.sh
      - name: Generated edge policy is up to date
        run: python deploy/cloudflare-edge/build_edge.py && git diff --exit-code -- deploy/cloudflare-edge/src/policy.generated.js
      - name: App unit tests
        run: node --test tests/*.test.js
      - name: Edge unit tests
        run: cd deploy/cloudflare-edge && node --test test/*.test.js
      - name: FFmpeg for the fifteen voice codec tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python tests (including the socket tests)
        run: python -m pytest tests/test_*.py -q
      - name: Browser suites
        run: |
          python -m playwright install --with-deps chromium
          for t in studio sculpture intelligence depth autosave orb_touch library reuse memory sheet report bids ask trust storyboard confirm wow_edge zero_config zero_config_edge jev_rating admin_metrics; do
            echo "::group::$t"; python tests/${t}_browser.py; echo "::endgroup::"
          done
