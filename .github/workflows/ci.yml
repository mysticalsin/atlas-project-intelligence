# Every push and pull request: the full ATLAS test suite (no provider keys, no network calls to paid services).
name: tests
# Hardening (B1): actions pinned to commit SHAs (tag in the trailing comment), read-only token, no credentials kept by checkout, no secrets used, and no
# privileged pull-request trigger (pull requests from forks run with the read-only token and without secrets).
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - name: Python dependencies
        run: pip install -r requirements.txt -r requirements-test.txt msgpack pyjwt cryptography playwright python-docx
      - name: Build the page (four aliases + edge copy)
        run: python build.py && cp ATLAS_Voice.html deploy/cloudflare-edge/src/atlas.html
      - name: Generated edge policy is up to date
        run: python deploy/cloudflare-edge/build_edge.py && git diff --exit-code -- deploy/cloudflare-edge/src/policy.generated.js
      - name: App unit tests
        run: node --test tests/*.test.js
      - name: Edge unit tests
        run: cd deploy/cloudflare-edge && node --test test/*.test.js
      - name: Python tests (including the socket tests)
        run: python -m pytest tests/test_*.py -q
      - name: Browser suites
        run: |
          python -m playwright install --with-deps chromium
          for t in studio sculpture intelligence depth autosave orb_touch library reuse memory sheet report bids ask trust storyboard confirm wow_edge zero_config zero_config_edge jev_rating; do
            echo "::group::$t"; python tests/${t}_browser.py; echo "::endgroup::"
          done
