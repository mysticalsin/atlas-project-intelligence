# Every push and pull request: the full ATLAS test suite (no provider keys, no network calls to paid services).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Python dependencies
        run: pip install -r requirements.txt -r requirements-test.txt msgpack pyjwt cryptography playwright python-docx
      - name: Build the page (four aliases + edge copy)
        run: python build.py && cp ATLAS_Voice.html deploy/cloudflare-edge/src/atlas.html
      - name: Generated edge policy is up to date
        run: python deploy/cloudflare-edge/build_edge.py && git diff --exit-code -- deploy/cloudflare-edge/src/policy.generated.js
      - name: App unit tests
        run: node --test tests/*.test.js
      - name: Edge unit tests
        run: cd deploy/cloudflare-edge && node --test test/*.test.js
      - name: Python tests (including the socket tests)
        run: python -m pytest tests/test_*.py -q
      - name: Browser suites
        run: |
          python -m playwright install --with-deps chromium
          for t in studio sculpture intelligence depth autosave orb_touch library reuse memory sheet; do
            echo "::group::$t"; python tests/${t}_browser.py; echo "::endgroup::"
          done
